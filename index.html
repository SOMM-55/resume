<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayyid Omid Mousavi Mehr — Full-Stack Developer | Data Engineer</title>
<meta name="description" content="Full-Stack Developer | Data Engineer with 7+ years of experience in data engineering, system architecture, Node.js, TypeScript, Python, PostgreSQL, microservices, ETL, and agentic / Spec-Driven Development.">
<meta name="author" content="Sayyid Omid Mousavi Mehr">
<meta name="keywords" content="Full-Stack Developer, Data Engineer, Node.js, TypeScript, Python, PostgreSQL, Microservices, ETL, SDD, Agentic Development, Sayyid Omid Mousavi Mehr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================= */
/*  RESUME — self-contained, ATS-friendly, print-ready           */
/* ============================================================= */

:root {
  --rv-ink: #1e293b;        /* charcoal-navy (primary text/headers) */
  --rv-accent: #0f766e;     /* teal-700 (section accents) */
  --rv-accent-soft: #ccfbf1;/* teal-100 */
  --rv-body: #334155;       /* slate-700 (body text) */
  --rv-muted: #64748b;      /* slate-500 (secondary) */
  --rv-line: #e2e8f0;       /* slate-200 (borders) */
  --rv-tint: #f8fafc;       /* slate-50 (sidebar tint) */
  --rv-tint-2: #f1f5f9;     /* slate-100 */
}

/* App chrome behind the resume */
.rv-app {
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, #e2f3f1 0%, transparent 60%),
    linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.25rem 1rem 3rem;
  gap: 1rem;
}

/* Floating toolbar (hidden in print) */
.rv-toolbar {
  position: sticky;
  top: 0.75rem;
  z-index: 50;
  width: 100%;
  max-width: 820px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.6rem 0.85rem;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  border: 1px solid var(--rv-line);
  box-shadow: 0 6px 20px -8px rgba(15, 23, 42, 0.25);
}

/* The resume "page" */
.rv-doc {
  width: 100%;
  max-width: 820px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 24px 60px -28px rgba(15, 23, 42, 0.45),
              0 2px 6px -2px rgba(15, 23, 42, 0.12);
  overflow: hidden;
  color: var(--rv-body);
  font-size: 13.5px;
  line-height: 1.55;
}

.rv-docInner {
  padding: 30px 34px 26px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Header */
.rv-header {
  border-bottom: 2px solid var(--rv-ink);
  padding-bottom: 14px;
}
.rv-name {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--rv-ink);
  line-height: 1.1;
}
.rv-title {
  margin-top: 4px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--rv-accent);
  letter-spacing: 0.01em;
}
.rv-contact {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 12px;
  color: var(--rv-muted);
}
.rv-contact a, .rv-contact span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  color: inherit;
}
.rv-contact a:hover { color: var(--rv-accent); }

/* Section headings */
.rv-h {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--rv-ink);
  margin-bottom: 8px;
}
.rv-h::after {
  content: "";
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, var(--rv-accent), transparent);
  border-radius: 2px;
}
.rv-h svg { color: var(--rv-accent); flex: none; }

/* Sections: scroll-margin so smooth-jump doesn't hide the heading under the sticky toolbar */
.rv-section { scroll-margin-top: 90px; }

/* ───────── Quick-jump section nav (screen only) ───────── */
.rv-quicknav {
  width: 100%;
  max-width: 820px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 6px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(8px);
  border: 1px solid var(--rv-line);
  box-shadow: 0 4px 14px -8px rgba(15, 23, 42, 0.2);
}
.rv-app.rv-dark .rv-quicknav {
  background: rgba(15, 23, 42, 0.6);
  border-color: #1e293b;
}
.rv-quickpill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--rv-muted);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.rv-quickpill svg { flex: none; }
.rv-quickpill:hover {
  background: var(--rv-tint-2);
  color: var(--rv-accent);
  border-color: var(--rv-line);
}
.rv-quickpill-active {
  background: var(--rv-accent) !important;
  color: #fff !important;
  border-color: var(--rv-accent) !important;
}
.rv-quickpill-active svg { color: #fff; }
.rv-app.rv-dark .rv-quickpill:hover { background: #1e293b; }

/* ───────── Header monogram avatar ───────── */
.rv-header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.rv-headerText { flex: 1; min-width: 200px; }
.rv-monogram {
  width: 56px;
  height: 56px;
  flex: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--rv-accent) 0%, #134e4a 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.02em;
  box-shadow: 0 6px 16px -6px rgba(15, 118, 110, 0.55);
  font-family: ui-monospace, "SFMono-Regular", monospace;
}
.rv-name {
  background: linear-gradient(135deg, var(--rv-ink) 0%, var(--rv-accent) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}
.rv-app.rv-dark .rv-name {
  background: linear-gradient(135deg, #e2e8f0 0%, var(--rv-accent) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ───────── Print footer with page number ───────── */
.rv-printFooter {
  display: none; /* only visible in print */
}
/* Fixed print running footer — repeats on every printed page (browser print) */
.rv-printRunning {
  display: none; /* screen hidden */
}
@media print {
  .rv-printFooter {
    display: flex !important;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 8px;
    border-top: 1px solid var(--rv-line);
    font-size: 8pt;
    color: var(--rv-muted);
  }
  .rv-printFooter .rv-pfName { font-weight: 600; }
  /* Running footer on every printed page: name left, "Page X" right via CSS counter */
  .rv-printRunning {
    display: flex !important;
    position: fixed;
    bottom: 4mm;
    left: 12mm;
    right: 12mm;
    justify-content: space-between;
    align-items: center;
    font-size: 7.5pt;
    color: var(--rv-muted);
    border-top: 1px solid var(--rv-line);
    padding-top: 2mm;
    z-index: 999;
  }
  .rv-printRunning .rv-pfLeft { font-weight: 600; }
  .rv-printRunning .rv-pfRight::before { content: counter(page); }
  .rv-printRunning .rv-pfRight::after { content: " / " counter(pages); }
}

/* Summary */
.rv-summary {
  font-size: 13px;
  color: var(--rv-body);
  border-left: 3px solid var(--rv-accent);
  padding: 2px 0 2px 12px;
}
.rv-summary[dir="rtl"] {
  border-left: none;
  border-right: 3px solid var(--rv-accent);
  padding: 2px 12px 2px 0;
}

/* Two-column body grid */
.rv-grid {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 22px;
}

/* Mobile / narrow preview: single column — sidebar stacks below main content.
   Breakpoint raised to 900px so preview panels and tablets also get a clean
   single-column layout instead of a cramped two-column. */
@media (max-width: 900px) {
  .rv-grid {
    grid-template-columns: 1fr !important;
    gap: 18px !important;
  }
  /* Sidebar loses its tinted full-bleed background and becomes inline blocks */
  .rv-side {
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    border: none !important;
    border-top: 2px solid var(--rv-line) !important;
    padding-top: 18px !important;
  }
  .rv-doc[dir="rtl"] .rv-side {
    margin: 0 !important;
    padding: 0 !important;
    padding-top: 18px !important;
    border: none !important;
    border-top: 2px solid var(--rv-line) !important;
  }
  .rv-docInner { padding: 22px 20px 22px !important; gap: 14px !important; }
  .rv-toolbar {
    flex-wrap: wrap;
    gap: 8px !important;
    padding: 0.5rem 0.6rem !important;
  }
  .rv-name { font-size: 22px !important; }
  .rv-contact { gap: 5px 12px !important; font-size: 11px !important; }
  /* Compact timeline on narrow screens — smaller dots, less inset */
  .rv-job { padding-inline-start: 18px !important; }
  .rv-doc[dir="rtl"] .rv-job { padding-inline-start: 0 !important; padding-inline-end: 18px !important; }
  .rv-job::before {
    width: 9px !important;
    height: 9px !important;
    border-width: 2px !important;
    box-shadow: 0 0 0 2px #fff !important;
    top: 5px !important;
  }
  .rv-expList::before { inset-inline-start: 4px !important; }
  .rv-doc[dir="rtl"] .rv-expList::before { inset-inline-start: auto !important; inset-inline-end: 4px !important; }
}
.rv-main { display: flex; flex-direction: column; gap: 16px; }
.rv-side {
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--rv-tint);
  margin: -30px -34px -26px 0;
  padding: 30px 26px 26px;
  border-left: 1px solid var(--rv-line);
}
/* RTL: sidebar sits on the left, mirror padding/border */
.rv-doc[dir="rtl"] .rv-side {
  margin: -30px 0 -26px -34px;
  padding: 30px 26px 26px;
  border-left: none;
  border-right: 1px solid var(--rv-line);
}

/* Job entry */
.rv-job { margin-bottom: 14px; }
.rv-job:last-child { margin-bottom: 0; }
.rv-jobHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.rv-role { font-size: 14px; font-weight: 700; color: var(--rv-ink); }
.rv-company { font-size: 13px; font-weight: 600; color: var(--rv-accent); }
.rv-meta {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  font-size: 11.5px;
  color: var(--rv-muted);
  margin-top: 2px;
}
.rv-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--rv-tint-2);
  color: var(--rv-ink);
  font-weight: 500;
}
.rv-overview { margin-top: 7px; font-size: 12.5px; }
.rv-bullets { margin-top: 7px; padding-left: 16px; display: flex; flex-direction: column; gap: 5px; }
.rv-doc[dir="rtl"] .rv-bullets { padding-left: 0; padding-right: 16px; }
.rv-bullets li { font-size: 12.5px; color: var(--rv-body); position: relative; }
.rv-bullets li::marker { color: var(--rv-accent); }
.rv-tech {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.rv-tag {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--rv-accent-soft);
  color: #115e59;
  border: 1px solid #99f6e4;
}

/* Project entry */
.rv-proj { padding: 8px 0; border-bottom: 1px dashed var(--rv-line); }
.rv-proj:last-child { border-bottom: none; }
.rv-projName { font-size: 12.5px; font-weight: 700; color: var(--rv-ink); }
.rv-projDesc { font-size: 12px; color: var(--rv-body); margin-top: 2px; }
.rv-projTech { font-size: 11px; color: var(--rv-muted); margin-top: 3px; font-weight: 500; }

/* Skill group */
.rv-skillGroup { margin-bottom: 10px; }
.rv-skillGroup:last-child { margin-bottom: 0; }
.rv-skillLabel {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--rv-ink);
  margin-bottom: 5px;
}
.rv-skillItems { display: flex; flex-wrap: wrap; gap: 5px; }
.rv-skillItem {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 5px;
  background: #ffffff;
  border: 1px solid var(--rv-line);
  color: var(--rv-body);
}

/* Education */
.rv-edu { margin-bottom: 10px; }
.rv-edu:last-child { margin-bottom: 0; }
.rv-eduDeg { font-size: 12.5px; font-weight: 700; color: var(--rv-ink); }
.rv-eduInst { font-size: 12px; color: var(--rv-accent); font-weight: 600; }
.rv-eduMeta { font-size: 11px; color: var(--rv-muted); margin-top: 1px; }
.rv-eduGrade { font-size: 11px; color: var(--rv-body); margin-top: 2px; font-weight: 500; }
.rv-eduThesis { font-size: 11px; color: var(--rv-muted); margin-top: 1px; font-style: italic; }

/* Certificates */
.rv-cert { margin-bottom: 6px; }
.rv-cert:last-child { margin-bottom: 0; }
.rv-certName { font-size: 12px; color: var(--rv-body); font-weight: 600; }
.rv-certIssuer { font-size: 11px; color: var(--rv-muted); }

/* Languages + interests inline lists */
.rv-langRow { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px dotted var(--rv-line); }
.rv-langRow:last-child { border-bottom: none; }
.rv-langName { font-weight: 600; color: var(--rv-ink); }
.rv-langLvl { color: var(--rv-muted); }

.rv-interestList { display: flex; flex-wrap: wrap; gap: 6px; }
.rv-interest {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #ffffff;
  border: 1px solid var(--rv-line);
  color: var(--rv-body);
}

/* Award callout */
.rv-award {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 11px;
  border-radius: 9px;
  background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
  border: 1px solid #fde68a;
}
.rv-award svg { color: #b45309; flex: none; margin-top: 1px; }
.rv-awardText { font-size: 11.5px; color: #78350f; line-height: 1.4; }
.rv-awardLabel { font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; color: #b45309; display: block; margin-bottom: 1px; }

/* Lang dropdown button */
.rv-langBtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 9px;
  border: 1px solid var(--rv-line);
  background: #fff;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--rv-ink);
  cursor: pointer;
  transition: all 0.15s ease;
}
.rv-langBtn:hover { border-color: var(--rv-accent); color: var(--rv-accent); }

.rv-printBtn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border-radius: 9px;
  border: none;
  background: var(--rv-accent);
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 4px 12px -4px rgba(15, 118, 110, 0.5);
}
.rv-printBtn:hover { background: #0d5f58; transform: translateY(-1px); }

/* Custom scrollbar for long content on screen */
.rv-doc::-webkit-scrollbar { width: 8px; }
.rv-doc::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }

/* RTL icon flip for directional icons */
.rv-doc[dir="rtl"] .rv-flip { transform: scaleX(-1); }

/* ============================================================= */
/*  DARK MODE — applied via .rv-dark on .rv-app                  */
/*  Print is always forced to light (see @media print).          */
/* ============================================================= */
.rv-app.rv-dark {
  background:
    radial-gradient(1200px 600px at 50% -10%, #0b3a36 0%, transparent 60%),
    linear-gradient(180deg, #0f172a 0%, #020617 100%);
}
.rv-app.rv-dark .rv-toolbar {
  background: rgba(15, 23, 42, 0.82);
  border-color: #1e293b;
  box-shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.6);
}
.rv-app.rv-dark {
  --rv-ink: #e2e8f0;
  --rv-accent: #2dd4bf;
  --rv-accent-soft: #134e4a;
  --rv-body: #cbd5e1;
  --rv-muted: #94a3b8;
  --rv-line: #1e293b;
  --rv-tint: #0f172a;
  --rv-tint-2: #1e293b;
}
.rv-app.rv-dark .rv-doc {
  background: #0b1220;
  box-shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.7),
              0 2px 6px -2px rgba(0, 0, 0, 0.4);
}
.rv-app.rv-dark .rv-header { border-bottom-color: #334155; }
.rv-app.rv-dark .rv-h { color: var(--rv-ink); }
.rv-app.rv-dark .rv-h::after { background: linear-gradient(90deg, var(--rv-accent), transparent); }
.rv-app.rv-dark .rv-tag {
  background: #134e4a;
  color: #5eead4;
  border-color: #0f766e;
}
.rv-app.rv-dark .rv-skillItem {
  background: #1e293b;
  border-color: #334155;
  color: #cbd5e1;
}
.rv-app.rv-dark .rv-pill {
  background: #1e293b;
  color: #cbd5e1;
}
.rv-app.rv-dark .rv-interest {
  background: #1e293b;
  border-color: #334155;
  color: #cbd5e1;
}
.rv-app.rv-dark .rv-side { background: #0a0f1d; border-left-color: #1e293b; }
.rv-app.rv-dark .rv-doc[dir="rtl"] .rv-side { border-right-color: #1e293b; }
.rv-app.rv-dark .rv-award {
  background: linear-gradient(135deg, #422006 0%, #451a03 100%);
  border-color: #78350f;
}
.rv-app.rv-dark .rv-awardText { color: #fbbf24; }
.rv-app.rv-dark .rv-awardLabel { color: #f59e0b; }
.rv-app.rv-dark .rv-langBtn { background: #0f172a; border-color: #334155; color: #e2e8f0; }
.rv-app.rv-dark .rv-langBtn:hover { border-color: var(--rv-accent); color: var(--rv-accent); }
.rv-app.rv-dark .rv-iconBtn { background: #0f172a; border-color: #334155; color: #e2e8f0; }
.rv-app.rv-dark .rv-iconBtn:hover { border-color: var(--rv-accent); color: var(--rv-accent); }
.rv-app.rv-dark .rv-menu { background: #0f172a; border-color: #334155; }
.rv-app.rv-dark .rv-menu button:hover { background: #134e4a !important; color: #5eead4 !important; }
.rv-app.rv-dark .rv-atsBadge {
  background: #134e4a;
  color: #5eead4;
  border-color: #0f766e;
}
.rv-app.rv-dark .rv-kbd { background: #1e293b; border-color: #334155; color: #94a3b8; }

/* ============================================================= */
/*  New controls: icon buttons, ATS badge, zoom, kbd hint        */
/* ============================================================= */
.rv-iconBtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--rv-line);
  background: #fff;
  color: var(--rv-ink);
  cursor: pointer;
  transition: all 0.15s ease;
}
.rv-iconBtn:hover { border-color: var(--rv-accent); color: var(--rv-accent); transform: translateY(-1px); }
.rv-iconBtn:active { transform: translateY(0); }
.rv-iconBtn[aria-pressed="true"] { background: var(--rv-accent); color: #fff; border-color: var(--rv-accent); }

.rv-atsBadge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--rv-accent-soft);
  color: #115e59;
  border: 1px solid #5eead4;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.rv-zoomReadout {
  font-size: 11px;
  font-weight: 700;
  color: var(--rv-muted);
  min-width: 34px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.rv-kbd {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 4px;
  background: #f1f5f9;
  border: 1px solid var(--rv-line);
  border-bottom-width: 2px;
  font-size: 10px;
  font-family: ui-monospace, monospace;
  color: var(--rv-muted);
  line-height: 1.2;
}
.rv-hintBar {
  font-size: 10.5px;
  color: var(--rv-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* Print overlay */
.rv-printOverlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(3px);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  gap: 10px;
  animation: rv-fade 0.18s ease;
}
@keyframes rv-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rv-spin { to { transform: rotate(360deg); } }
.rv-spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: rv-spin 0.7s linear infinite;
}

/* ============================================================= */
/*  Styling refinements: timeline, hover lifts, accents          */
/* ============================================================= */

/* Job timeline rail (main column experience) */
.rv-expList { position: relative; }
.rv-expList::before {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 4px;
  inset-inline-start: 5px;
  width: 2px;
  background: linear-gradient(180deg, var(--rv-accent), var(--rv-line));
  border-radius: 2px;
}
.rv-doc[dir="rtl"] .rv-expList::before { inset-inline-start: auto; inset-inline-end: 5px; }
.rv-job { position: relative; padding-inline-start: 22px; }
.rv-doc[dir="rtl"] .rv-job { padding-inline-start: 0; padding-inline-end: 22px; }
.rv-job::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--rv-accent);
  box-shadow: 0 0 0 3px #fff;
  z-index: 1;
}
.rv-doc[dir="rtl"] .rv-job::before { inset-inline-start: auto; inset-inline-end: 0; }

/* Hover lifts */
.rv-skillItem, .rv-tag, .rv-interest, .rv-pill { transition: transform .12s ease, background .12s ease, border-color .12s ease; }
.rv-skillItem:hover { transform: translateY(-1px); border-color: var(--rv-accent); color: var(--rv-accent); }
.rv-tag:hover { transform: translateY(-1px); }
.rv-interest:hover { border-color: var(--rv-accent); color: var(--rv-accent); }
.rv-proj { transition: background .12s ease, padding .12s ease; border-radius: 6px; padding-inline: 6px; }
.rv-proj:hover { background: var(--rv-tint-2); }
.rv-contact a { transition: color .12s ease; }
.rv-edu, .rv-cert { transition: transform .12s ease; }
.rv-edu:hover, .rv-cert:hover { transform: translateX(2px); }
.rv-doc[dir="rtl"] .rv-edu:hover, .rv-doc[dir="rtl"] .rv-cert:hover { transform: translateX(-2px); }

/* Skill group accent bar */
.rv-skillLabel { display: flex; align-items: center; gap: 6px; }
.rv-skillLabel::before {
  content: "";
  width: 3px; height: 11px;
  border-radius: 2px;
  background: var(--rv-accent);
  display: inline-block;
}

/* Focus ring for accessibility on all interactive controls */
.rv-iconBtn:focus-visible, .rv-langBtn:focus-visible, .rv-printBtn:focus-visible, .rv-menu button:focus-visible {
  outline: 2px solid var(--rv-accent);
  outline-offset: 2px;
}

/* ============================================================= */
/*  PRINT — A4, controlled page breaks, colors preserved         */
/* ============================================================= */
@media print {
  @page {
    size: A4;
    margin: 12mm 12mm 12mm 12mm;
  }
  html, body {
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .rv-app {
    background: none !important;
    padding: 0 !important;
    gap: 0 !important;
    display: block !important;
  }
  .rv-toolbar, .rv-hintBar, .rv-printOverlay { display: none !important; }
  /* Always print in light mode for ATS cleanliness */
  .rv-app.rv-dark {
    background: none !important;
    --rv-ink: #1e293b !important;
    --rv-accent: #0f766e !important;
    --rv-accent-soft: #ccfbf1 !important;
    --rv-body: #334155 !important;
    --rv-muted: #64748b !important;
    --rv-line: #e2e8f0 !important;
    --rv-tint: #f8fafc !important;
    --rv-tint-2: #f1f5f9 !important;
  }
  .rv-app.rv-dark .rv-doc { background: #fff !important; }
  .rv-app.rv-dark .rv-side { background: transparent !important; }

  .rv-app.rv-dark .rv-awardText { color: #78350f !important; }
  .rv-app.rv-dark .rv-awardLabel { color: #b45309 !important; }
  .rv-doc {
    max-width: none !important;
    width: 100% !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    font-size: 10.2pt !important;
  }
  .rv-docInner { padding: 0 !important; gap: 10px !important; }
  .rv-side {
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    border: none !important;
  }
  .rv-doc[dir="rtl"] .rv-side {
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }
  .rv-grid { gap: 14px !important; grid-template-columns: 1.5fr 1fr !important; }
  .rv-name { font-size: 19pt !important; }
  .rv-title { font-size: 11pt !important; }
  .rv-h { font-size: 9.5pt !important; margin-bottom: 5px !important; }
  .rv-summary { font-size: 9.6pt !important; }
  .rv-role { font-size: 10.5pt !important; }
  .rv-company { font-size: 9.8pt !important; }
  .rv-overview, .rv-bullets li { font-size: 9.4pt !important; }
  .rv-tag, .rv-skillItem, .rv-pill, .rv-interest { font-size: 8pt !important; }

  /* keep entries together, avoid awkward breaks */
  .rv-job, .rv-edu, .rv-proj, .rv-skillGroup, .rv-award {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .rv-h { break-after: avoid; page-break-after: avoid; }
  .rv-side, .rv-main { break-inside: auto; }

  /* force background colors to print */
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}

/* Persian & Arabic → Vazirmatn */

/* Chinese → Noto Sans SC */

}

}

.rv-kbd { font-family: var(--rv-font-mono); }

/* ───────── Reading progress bar ───────── */
.rv-progress {
  position: fixed; top: 0; left: 0; right: 0;
  height: 3px; background: transparent; z-index: 100;
}
.rv-progressFill {
  height: 100%;
  background: linear-gradient(90deg, var(--rv-accent), #2dd4bf);
  transition: width 0.1s ease;
  box-shadow: 0 0 8px rgba(15, 118, 110, 0.5);
}

/* ───────── Back to top button ───────── */
.rv-topBtn {
  position: fixed; bottom: 24px; inset-inline-end: 24px;
  width: 42px; height: 42px; border-radius: 50%;
  border: none; background: var(--rv-accent); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px -4px rgba(15, 118, 110, 0.5);
  opacity: 0; transform: translateY(10px); pointer-events: none;
  transition: all 0.2s ease; z-index: 90;
}
.rv-topBtn.rv-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.rv-topBtn:hover { background: #0d5f58; transform: translateY(-2px); }

/* ───────── Help dialog ───────── */
.rv-helpOverlay {
  position: fixed; inset: 0; z-index: 110;
  background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: rv-fade 0.18s ease;
}
.rv-helpDialog {
  position: relative; background: #fff; border-radius: 14px;
  box-shadow: 0 30px 80px -20px rgba(15,23,42,.5);
  max-width: 420px; width: 100%; padding: 24px; color: var(--rv-body);
}
.rv-app.rv-dark .rv-helpDialog { background: #0f172a; }
.rv-helpTitle { font-size: 16px; font-weight: 700; color: var(--rv-ink); margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }

.rv-helpList { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.rv-helpItem { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--rv-body); }
.rv-helpKeys { display: flex; gap: 4px; }
.rv-helpClose {
  position: absolute; top: 14px; inset-inline-end: 14px;
  width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid var(--rv-line); background: #fff; color: var(--rv-ink);

}

function render() {

  const u = uiStrings[lang];

  document.title = identity.name + " — " + c.title;
  document.getElementById("app").className = "rv-app" + (dark ? " rv-dark" : "");

  doc.setAttribute("dir", c.dir);
  doc.setAttribute("lang", lang);

  document.getElementById("atsBadgeText").textContent = u.atsBadge;
  document.getElementById("atsBadge").title = u.atsBadgeTitle;

  document.getElementById("langLabel").textContent = languages.find(l => l.code === lang).label;

  let html = '<aside class="rv-side">';
  html += '<section id="sec-skills" class="rv-section" aria-label="' + c.sections.skills + '"><h2 class="rv-h">' + icons.code + ' ' + c.sections.skills + '</h2>';
  html += c.skills.map(g => '<div class="rv-skillGroup"><div class="rv-skillLabel">' + g.label + '</div><div class="rv-skillItems">' + g.items.map(s => '<span class="rv-skillItem">' + s + '</span>').join("") + '</div></div>').join("");
  html += '</section>';
  html += '<section id="sec-education" class="rv-section" aria-label="' + c.sections.education + '"><h2 class="rv-h">' + icons.grad + ' ' + c.sections.education + '</h2>';
  html += c.education.map(e => '<article class="rv-edu"><div class="rv-eduDeg">' + e.degree + '</div><div class="rv-eduInst">' + e.institution + '</div><div class="rv-eduMeta">' + e.location + ' · ' + e.period + '</div><div class="rv-eduGrade">' + e.grade + '</div>' + (e.thesis ? '<div class="rv-eduThesis">' + c.ui.thesis + ': ' + e.thesis + '</div>' : '') + '</article>').join("");
  html += '</section>';
  html += '<section id="sec-certificates" class="rv-section" aria-label="' + c.sections.certificates + '"><h2 class="rv-h">' + icons.scroll + ' ' + c.sections.certificates + '</h2>';
  html += c.certificates.map(cert => '<div class="rv-cert"><div class="rv-certName">' + cert.name + '</div><div class="rv-certIssuer">' + cert.issuer + '</div></div>').join("");
  html += '</section>';
  html += '<section id="sec-languages" class="rv-section" aria-label="' + c.sections.languages + '"><h2 class="rv-h">' + icons.langs + ' ' + c.sections.languages + '</h2>';
  html += c.languagesKnown.map(l => '<div class="rv-langRow"><span class="rv-langName">' + l.name + '</span><span class="rv-langLvl">' + l.level + '</span></div>').join("");
  html += '</section>';
  html += '<section id="sec-interests" class="rv-section" aria-label="' + c.sections.interests + '"><h2 class="rv-h">' + icons.heart + ' ' + c.sections.interests + '</h2><div class="rv-interestList">' + c.interests.map(it => '<span class="rv-interest">' + it + '</span>').join("") + '</div></section>';
  html += '</aside>';
  return html;
}

function setLang(code) {
  if (!content[code]) return;
  lang = code;
  try { localStorage.setItem("rv:lang", code); } catch(e){}
  history.replaceState(null, "", "#lang=" + code);
  render();
  setupScrollspy();
}

function toggleDark() {
  dark = !dark;
  try { localStorage.setItem("rv:dark", dark ? "1" : "0"); } catch(e){}
  render();
}

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById("langMenu").style.display = menuOpen ? "block" : "none";
  document.getElementById("langBtn").setAttribute("aria-expanded", menuOpen);
  document.getElementById("langChevron").style.transform = menuOpen ? "rotate(180deg)" : "none";
}
function closeMenu() {
  if (!menuOpen) return;
  menuOpen = false;
  document.getElementById("langMenu").style.display = "none";
  document.getElementById("langBtn").setAttribute("aria-expanded", "false");
  document.getElementById("langChevron").style.transform = "none";
}

function jumpTo(id) {
  const el = document.getElementById("sec-" + id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  history.replaceState(null, "", "#lang=" + lang);
}

function handlePrint() { window.print(); }

function handleCopyText() {
  const c = content[lang];
  const lines = [identity.name, c.title, identity.email + " | " + identity.phone + " | " + identity.location, identity.linkedinHref + " | " + identity.githubHref, "", "========================================", c.sections.summary.toUpperCase(), "========================================", c.summary, "", "========================================", c.sections.experience.toUpperCase(), "========================================"];
  for (const job of c.jobs) { lines.push("", job.role + " — " + job.company, job.location + " | " + job.period + " | " + job.typeLabel + " | " + job.modelLabel, "", job.overview, ""); for (const a of job.achievements) lines.push("  - " + a); lines.push("", "Technologies: " + job.tech.join(", ")); }
  lines.push("", "========================================", c.sections.projects.toUpperCase(), "========================================");
  for (const p of c.projects) lines.push("", p.name, p.description, "Tech: " + p.tech);
  lines.push("", "========================================", c.sections.skills.toUpperCase(), "========================================");
  for (const g of c.skills) lines.push(g.label + ": " + g.items.join(", "));
  lines.push("", "========================================", c.sections.education.toUpperCase(), "========================================");
  for (const e of c.education) { lines.push("", e.degree + " — " + e.institution, e.location + " | " + e.period, e.grade, e.thesis ? c.ui.thesis + ": " + e.thesis : ""); }
  lines.push("", "========================================", c.sections.certificates.toUpperCase(), "========================================");
  for (const cert of c.certificates) lines.push("- " + cert.name + " (" + cert.issuer + ")");
  lines.push("", "========================================", c.sections.languages.toUpperCase(), "========================================");
  for (const l of c.languagesKnown) lines.push(l.name + ": " + l.level);
  lines.push("", "========================================", c.sections.interests.toUpperCase(), "========================================", c.interests.join(", "));
  const text = lines.join("\n");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(()=>{});
  else { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
}

function handleDownload() {
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = identity.name.replace(/\s+/g, "_") + "_Resume_" + lang + ".html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let observer;
function setupScrollspy() {
  if (observer) observer.disconnect();
  const ids = ["summary","experience","projects","skills","education","certificates","languages","interests"];
  const sections = ids.map(id => document.getElementById("sec-" + id)).filter(Boolean);
  if (!sections.length) return;
  observer = new IntersectionObserver((entries) => {
    const visible = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio);
    if (visible[0]) {
      const newActive = visible[0].target.id.replace(/^sec-/, "");
      if (newActive !== activeSection) {
        activeSection = newActive;
        document.querySelectorAll(".rv-quickpill").forEach(p => p.classList.toggle("rv-quickpill-active", p.dataset.jump === activeSection));
      }
    }
  }, { rootMargin: "-20% 0px -60% 0px", threshold: [0, 0.25, 0.5, 0.75, 1] });
  sections.forEach(s => observer.observe(s));
}

function onScroll() {
  const st = window.scrollY;
  const dh = document.documentElement.scrollHeight - window.innerHeight;
  const pct = dh > 0 ? Math.min(100, Math.max(0, (st / dh) * 100)) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("topBtn").classList.toggle("rv-visible", st > 400);
}

document.getElementById("darkBtn").addEventListener("click", toggleDark);
document.getElementById("copyBtn").addEventListener("click", handleCopyText);
document.getElementById("downloadBtn").addEventListener("click", handleDownload);
document.getElementById("printBtn").addEventListener("click", handlePrint);
document.getElementById("langBtn").addEventListener("click", toggleMenu);
document.getElementById("helpBtn").addEventListener("click", () => { document.getElementById("helpOverlay").style.display = "flex"; });
document.getElementById("helpClose").addEventListener("click", () => { document.getElementById("helpOverlay").style.display = "none"; });
document.getElementById("helpOverlay").addEventListener("click", (e) => { if (e.target.id === "helpOverlay") e.target.style.display = "none"; });
document.getElementById("topBtn").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
document.addEventListener("click", (e) => { if (menuOpen && !document.getElementById("langWrap").contains(e.target)) closeMenu(); });
window.addEventListener("hashchange", () => { const m = location.hash.match(/lang=([a-z]{2})/i); if (m && content[m[1]] && m[1] !== lang) setLang(m[1]); });
window.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "p") { e.preventDefault(); handlePrint(); }
  else if (k === "d") { e.preventDefault(); handleDownload(); }
  else if (k === "c") { e.preventDefault(); handleCopyText(); }
  else if (k === "?" || (e.shiftKey && k === "/")) { e.preventDefault(); document.getElementById("helpOverlay").style.display = "flex"; }
  else if (k === "escape") { document.getElementById("helpOverlay").style.display = "none"; closeMenu(); }
});
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", onScroll);

render();
setupScrollspy();
onScroll();
</script>
</body>
</html>
